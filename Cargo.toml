[workspace]

members = [ "tpchgen", "tpcdsgen" , "tpchgen-arrow", "tpchgen-cli", "tpcdsgen-arrow", "tpcgen"]

resolver = "2"

[workspace.package]
authors = ["clflushopt", "alamb"]
edition = "2021"
homepage = "https://github.com/clflushopt/tpchgen-rs"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/clflushopt/tpchgen-rs"
version = "3.0.0"

[profile.release]
codegen-units = 1
lto = true
strip = "debuginfo"
