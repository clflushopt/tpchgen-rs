name: TPC-DS Conformance

on:
  push:
    branches: [ main, master ]
    paths:
      - 'tpcdsgen/**'
      - 'tpcgen-cli/**'
      - '.github/**'
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Conformance testing against the Java / Trino reference implementation.
  conformance-tests:
    name: Conformance Tests (Java)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

    - name: Cache Rust dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Build Rust table generators
      run: |
        cargo build --locked --release -p tpcgen-cli

    - name: Run conformance tests (Rust vs Java)
      run: |
        cd tpcgen-cli
        ./scripts/tpcds/compare-all-tables.sh

  # Conformance testing against the C dsdgen reference implementation.
  conformance-tests-c:
    name: Conformance Tests (C dsdgen)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

    - name: Cache Rust dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Build Rust table generators
      run: |
        cargo build --locked --release -p tpcgen-cli

    - name: Run conformance tests (Rust --compat c vs C dsdgen)
      run: |
        cd tpcgen-cli
        ./scripts/tpcds/compare-all-tables.sh --compat c
