name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:  # Allow manual triggering

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run cargo-fmt
        run: cargo fmt --all -- --check
      - name: Run cargo-clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Check
        run: cargo check --locked --verbose --workspace --all-targets
      - name: Check tpchgen-cli without default features
        run: cargo check --locked -p tpchgen-cli --all-targets --no-default-features
      - name: Check tpcgen-cli without default features
        run: cargo check --locked -p tpcgen-cli --all-targets --no-default-features

  # Documentation examples tests
  test-doc-examples:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - name: Doc Examples (cargo test --workspace --doc)
        run: cargo test --locked --workspace --doc

  # Library and integration tests
  test-workspace:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2.86.6
        with:
          tool: nextest@0.9.140
      # nextest runs lib, bins and test targets by default (doc tests are
      # not supported by nextest and are covered by the job above)
      - name: All Tests (workspace)
        run: cargo nextest run --locked --workspace

  # documentation build
  docs:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - name : Build docs
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --no-deps --workspace

  # Build wheels + sdist (but don’t upload artifacts)
  build-packages:
    needs: lint
    uses: ./.github/workflows/build-py-packages.yml
    with:
      upload-artifacts: false
