name: tpcgen-cli-publish-pypi

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Optional Cargo.toml version override. A leading v is stripped (for example, v0.1.0-alpha.2)."
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-py-packages.yml
    with:
      upload-artifacts: true
      package: tpcgen-cli
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}

  release:
    name: Release
    runs-on: ubuntu-latest
    environment: pypi
    needs: [build]
    permissions:
      contents: read
      id-token: write # Use to sign the release artifacts and for pypi trusted publishing
      attestations: write # Used to generate artifact attestation
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: '*'
          merge-multiple: true
          path: dist

      - name: Install twine
        run: python -m pip install --upgrade twine

      - name: Check distributions
        run: python -m twine check --strict dist/*

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'dist/*'

      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*
