name: "Set Cargo Version"
description: "Sets a version override in a checked-out Cargo.toml"
inputs:
  package:
    description: "Package to update"
    required: true
  version:
    description: "Version to set. A leading v is stripped."
    required: true
runs:
  using: "composite"
  steps:
    - name: Install toml-cli
      shell: bash
      run: cargo install toml-cli

    - name: Set Cargo.toml version
      shell: bash
      env:
        PACKAGE: ${{ inputs.package }}
        VERSION: ${{ inputs.version }}
      run: |
        VERSION="${VERSION#v}"

        case "$PACKAGE" in
          all)
            echo "Version override requires selecting a single package." >&2
            exit 1
            ;;
          tpchgen)
            manifest="Cargo.toml"
            key="workspace.package.version"
            ;;
          *)
            manifest="$PACKAGE/Cargo.toml"
            key="package.version"
            ;;
        esac

        toml set "$manifest" "$key" "$VERSION" > tmp.toml
        mv tmp.toml "$manifest"
        toml get "$manifest" "$key"
