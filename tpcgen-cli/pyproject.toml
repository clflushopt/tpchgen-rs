[build-system]
requires = ["maturin>=1.9.3,<2.0"]
build-backend = "maturin"

[project]
name = "tpcgen-cli"
dynamic = ["version", "description", "readme", "license", "authors", "keywords"]
requires-python = ">=3.8"
license-files = ["LICENSE"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Rust",
    "Topic :: Database",
    "Topic :: System :: Benchmark",
]

[project.urls]
Homepage = "https://github.com/datafusion-contrib/tpcgen-rs/tree/main/tpcgen-cli"
Repository = "https://github.com/datafusion-contrib/tpcgen-rs"
Issues = "https://github.com/datafusion-contrib/tpcgen-rs/issues"

[tool.maturin]
bindings = "bin"
