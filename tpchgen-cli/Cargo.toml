[package]
name = "tpchgen-cli"
version = "3.0.0"
authors = { workspace = true }
description = "Blazing fast pure Rust TPC-H data generator command line tool."
readme = "README.md"
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[[bin]]
name = "tpchgen-cli"
path = "bin/tpchgen_cli.rs"
required-features = ["indicatif-progress"]

[dependencies]
clap = { version = "4.5.32", features = ["derive"] }
tpcgen-cli = { path = "../tpcgen-cli", version = "0.1.0", default-features = false }
tokio = { version = "1.44.1", features = ["full"] }

[features]
default = ["indicatif-progress"]
# Enable progress callbacks for applications that want to provide their own
# progress reporting without pulling in the default terminal progress bars.
progress = ["tpcgen-cli/progress"]
# Enable the default CLI terminal progress bars backed by `indicatif`.
indicatif-progress = ["progress", "tpcgen-cli/indicatif-progress"]

[dev-dependencies]
assert_cmd = "2.0"
parquet = "59"
predicates = "3.0"
tempfile = "3.20.0"
flate2 = "1.1.0"
tpchgen = { path = "../tpchgen", version = "3.0.0" }
tpchgen-arrow = { path = "../tpchgen-arrow", version = "3.0.0" }
