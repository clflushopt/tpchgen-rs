[package]
name = "tpchgen-cli"
version = "2.0.2"
authors = { workspace = true }
description = "Blazing fast pure Rust TPC-H data generator command line tool and library."
readme = "README.md"
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[lib]
name = "tpchgen_cli"
path = "src/lib.rs"

[[bin]]
name = "tpchgen-cli"
path = "bin/tpchgen_cli.rs"
required-features = ["indicatif-progress"]

[dependencies]
arrow = { workspace = true }
parquet = "59"
clap = { version = "4.5.32", features = ["derive"] }
tpchgen = { path = "../tpchgen", version = "2.0.2" }
tpchgen-arrow = { path = "../tpchgen-arrow", version = "2.0.2" }
tokio = { version = "1.44.1", features = ["full"] }
futures = "0.3.31"
num_cpus = "1.0"
log = "0.4.26"
env_logger = "0.11.7"
indicatif = { version = "0.18.3", optional = true }

[features]
default = ["indicatif-progress"]
# Enable progress callbacks for applications that want to provide their own
# progress reporting without pulling in the default terminal progress bars.
progress = []
# Enable the default CLI terminal progress bars backed by `indicatif`.
indicatif-progress = ["progress", "dep:indicatif"]

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
tempfile = "3.20.0"
flate2 = "1.1.0"
