[package]
name = "tpchgen-arrow"
version = { workspace = true }
rust-version = { workspace = true }
edition = "2024"
authors = { workspace = true }
description = "TPC-H data generator into Apache Arrow format"
keywords = ["tpch", "benchmark", "data-generator", "arrow", "olap"]
categories = ["database", "development-tools::profiling", "development-tools::testing"]
repository = { workspace = true }
homepage = "https://github.com/datafusion-contrib/tpcgen-rs/tree/main/tpchgen-arrow"
readme = "README.md"
license = { workspace = true }

[dependencies]
arrow_59 = { workspace = true, optional = true }
arrow_60 = { workspace = true, optional = true }
tpchgen = { workspace = true }

[features]
default = ["arrow_60"]
# Build against arrow 60 (the default).
arrow_60 = ["dep:arrow_60"]
# Build against arrow 59. Also disable default features so arrow 60 is not
# compiled as well.
arrow_59 = ["dep:arrow_59"]

[dev-dependencies]
# Enable the arrow features used by tests and doc examples.
arrow_59 = { workspace = true, features = ["csv", "prettyprint"] }
arrow_60 = { workspace = true, features = ["csv", "prettyprint"] }
chrono = "0.4.39"
